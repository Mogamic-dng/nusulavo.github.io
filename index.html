<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVO-meter · Makalah Profesional</title>
    
    <!-- Font Modern Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons (Professional stroke icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ---------- RESET & VARIABEL PROFESIONAL ---------- */
        :root {
            --primary: #2563eb;        /* Biru solid */
            --primary-light: #3b82f6;
            --primary-soft: #eff6ff;    /* background aktif */
            --accent: #0ea5e9;
            --secondary: #10b981;
            --bg: #ffffff;
            --panel: #f9fafb;
            --text: #1e293b;
            --heading: #0f172a;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --sidebar-w: 260px;
            --content-max-width: 850px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-soft: #1e293b;
            --bg: #0b1120;
            --panel: #111827;
            --text: #e2e8f0;
            --heading: #f1f5f9;
            --border: #334155;
            --shadow: 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: var(--font-sans);
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            line-height: 1.6;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* ---------- PROGRESS BAR (MINIMAL) ---------- */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .progress-container.visible {
            opacity: 1;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.2s ease;
        }

        /* ---------- SIDEBAR NAVIGASI (BERSIH) ---------- */
        nav {
            width: var(--sidebar-w);
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        nav h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--primary);
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .nav-link {
            background: transparent;
            border: none;
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 4px;
            cursor: pointer;
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
            border-radius: 8px;
            width: 100%;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link i {
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
        }

        .nav-link:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .nav-link.active {
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            box-shadow: none;
        }

        .controls {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-btn {
            padding: 10px 14px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            transition: background 0.15s, border 0.15s;
        }

        .control-btn i {
            width: 18px;
            height: 18px;
            stroke-width: 1.8;
        }

        .control-btn:hover {
            background: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ---------- MAIN CONTENT (ELEGAN, NO ANIMASI BERLEBIH) ---------- */
        main {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
            outline: none;
            scroll-behavior: smooth;
        }

        article {
            max-width: var(--content-max-width);
            margin: 0 auto;
            animation: fadeInContent 0.25s ease-out;
        }

        @keyframes fadeInContent {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: var(--heading);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 0;
            margin-bottom: 1.2rem;
            border-left: none;
            padding-left: 0;
        }

        h3 {
            color: var(--heading);
            margin: 2em 0 0.8em;
            font-size: 1.5rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        h4 {
            color: var(--heading);
            margin: 1.5em 0 0.5em;
            font-weight: 600;
            font-size: 1.2rem;
        }

        p, ul, ol {
            margin-bottom: 1.2em;
        }

        ul, ol {
            padding-left: 1.6em;
        }

        li {
            margin-bottom: 0.4em;
        }

        /* ---------- GARIS PEMISAH (SIMPEL) ---------- */
        hr {
            border: 0;
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        /* ---------- TABEL (BERSIH) ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 28px 0;
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* ---------- KOTAK INFO / WARNING / HIGHLIGHT (SOFT & FLAT) ---------- */
        .info-box, .warning-box, .highlight-box, .quote {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px 26px;
            margin: 28px 0;
            color: var(--text);
            box-shadow: none;
        }

        [data-theme="dark"] .info-box,
        [data-theme="dark"] .warning-box,
        [data-theme="dark"] .highlight-box,
        [data-theme="dark"] .quote {
            background: #1e293b;
            border-color: #334155;
        }

        .info-box {
            border-left: 4px solid var(--secondary);
        }

        .warning-box {
            border-left: 4px solid #ef4444;
        }

        .highlight-box {
            border-left: 4px solid var(--primary);
        }

        .quote {
            font-style: italic;
            border-left: 4px solid var(--accent);
        }

        /* Hilangkan pseudo-element sebelumnya */
        .info-box h4, .warning-box h4, .highlight-box h4 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--heading);
            font-weight: 600;
        }

        /* ---------- KOMPONEN LIST ---------- */
        .component-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .component-item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            transition: border 0.15s;
        }

        .component-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* ---------- CREDIT SECTION (TIM) ---------- */
        .credit-section {
            background: var(--panel);
            border-radius: 16px;
            padding: 28px;
            margin: 40px 0;
            border: 1px solid var(--border);
        }

        .credit-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .credit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .credit-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            transition: border 0.15s;
        }

        .credit-name {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .credit-nis {
            color: var(--primary);
            font-weight: 500;
        }

        /* ---------- KALKULATOR (MODERN FLAT) ---------- */
        .calculator-container {
            background: var(--panel);
            border-radius: 16px;
            padding: 30px;
            margin: 32px 0;
            border: 1px solid var(--border);
        }

        .calculator-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin: 24px 0;
        }

        .input-group label {
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: border 0.15s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .calculator-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .calc-btn {
            padding: 12px 22px;
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s, border 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .calc-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .calc-btn.primary:hover {
            background: #1d4ed8;
        }

        .calc-btn:hover {
            background: var(--primary-soft);
            border-color: var(--primary);
        }

        .calculator-result {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
            border: 1px solid var(--border);
        }

        [data-theme="dark"] .calculator-result {
            background: #1e293b;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .formula-display {
            background: var(--bg);
            border-radius: 10px;
            padding: 18px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        /* ---------- RESPONSIVE (TANPA ANIMASI BERLEBIH) ---------- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            nav {
                width: 100%;
                position: sticky;
                top: 0;
                flex-direction: row;
                overflow-x: auto;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                z-index: 50;
            }
            nav h1 {
                display: none;
            }
            .nav-link {
                width: auto;
                white-space: nowrap;
                margin-right: 8px;
                padding: 8px 14px;
            }
            .controls {
                flex-direction: row;
                border-top: none;
                margin-left: auto;
                padding-top: 0;
            }
            main {
                padding: 24px 20px;
            }
            h2 {
                font-size: 1.9rem;
            }
        }

        /* ---------- SCROLLBAR ELEGAN ---------- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Hilangkan semua animasi kompleks */
        .content-section, h3, h4, p, ul, ol, table, .quote {
            animation: none;
            opacity: 1;
            transform: none;
        }

        /* Utility untuk ikon dalam teks */
        .icon-inline {
            width: 1.2em;
            height: 1.2em;
            display: inline-block;
            vertical-align: middle;
            stroke-width: 2;
        }

        /* dark mode tweaks */
        [data-theme="dark"] .info-box {
            background: #1e293b;
        }
        [data-theme="dark"] .component-item {
            background: #1e293b;
        }
    </style>
</head>
<body>
    <!-- Progress Bar -->
    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <nav aria-label="Navigasi Utama">
        <h1>AVO-meter</h1>
        <div id="nav-items"></div>
        <div class="controls">
            <button id="theme-toggle" class="control-btn" title="Ganti tema">
                <i data-lucide="sun-moon"></i> <span>Tema</span>
            </button>
            <button id="layout-toggle" class="control-btn" title="Ganti layout">
                <i data-lucide="smartphone"></i> <span>Layout</span>
            </button>
        </div>
    </nav>

    <main id="main-content" role="main" tabindex="-1">
        <article id="app"></article>
    </main>

    <script>
        // Data model tanpa emoji, menggunakan ikon Lucide nanti via render
        const Model = {
            "home": { 
                t: "Beranda", 
                icon: "home",
                h: "Makalah AVO-meter", 
                c: `<div class="content-section">
                        <p>Makalah ini disusun sebagai tugas akhir mata pelajaran <strong>Pemrograman Web</strong> dan <strong>Praktik Pengukuran Listrik</strong>.</p>
                        <div class="quote">"Teknologi berkembang pesat, tetapi dasar-dasar pengukuran listrik tetap menjadi fondasi yang tak tergantikan."</div>
                    </div>
                    <div class="content-section">
                        <h3>Tujuan Pembelajaran</h3>
                        <p><strong>Tujuan:</strong> Membekali pemahaman dasar, prinsip kerja, dan perawatan alat ukur listrik AVO-meter untuk siswa Teknik Komputer dan Jaringan.</p>
                    </div>
                    <div class="info-box">
                        <h4><i data-lucide="target" style="width:20px;height:20px;"></i> Ruang Lingkup</h4>
                        <ul>
                            <li>Konsep dasar dan prinsip kerja AVO-meter</li>
                            <li>Perbedaan multimeter analog dan digital</li>
                            <li>Teknik pengukuran yang benar dan aman</li>
                            <li>Penerapan hukum Ohm</li>
                        </ul>
                    </div>
                    <div class="credit-section">
                        <h3 class="credit-title"><i data-lucide="users" style="width:28px;height:28px;"></i> Tim Penyusun</h3>
                        <div class="credit-grid">
                            <div class="credit-card"><div class="credit-name">M Agus Nusul</div><div class="credit-nis">Absen: 20</div><div class="credit-role">Koordinator Konten</div></div>
                            <div class="credit-card"><div class="credit-name">Tirto Laksono Aji</div><div class="credit-nis">Absen: 36</div><div class="credit-role">Peneliti & Analisis</div></div>
                            <div class="credit-card"><div class="credit-name">Tio Novan Pratama</div><div class="credit-nis">Absen: 35</div><div class="credit-role">Web Developer</div></div>
                            <div class="credit-card"><div class="credit-name">Nadhif Mahardika</div><div class="credit-nis">Absen: 29</div><div class="credit-role">Penyusun Materi</div></div>
                            <div class="credit-card"><div class="credit-name">Rezqy Amru</div><div class="credit-nis">Absen: 32</div><div class="credit-role">Validator</div></div>
                        </div>
                        <div class="team-info"><div class="team-class">X TKJ 1 · SMK Negeri 2 Surabaya</div><div class="team-year">Tahun Ajaran 2025/2026</div></div>
                    </div>`
            },
            "bab1": { t: "BAB 1", icon: "file-text", h: "Pendahuluan", c: `<h3>Latar Belakang</h3><p>AVO-meter menyediakan solusi serbaguna untuk mengukur arus, tegangan, dan hambatan.</p><h3>Tujuan Penulisan</h3><ul><li>Menjelaskan prinsip kerja AVO-meter</li><li>Panduan praktis penggunaan</li><li>Teknik kalibrasi dan perawatan</li></ul>` },
            "bab2": { t: "BAB 2", icon: "book-open", h: "Teori & Pengertian", c: `<h3>Definisi dan Fungsi</h3><p>AVO = Ampere, Volt, Ohm.</p><div class="component-list"><div class="component-item"><div class="component-title">Papan Skala</div>Untuk membaca hasil</div><div class="component-item"><div class="component-title">Saklar Pemilih</div>Memilih mode ukur</div></div><h3>Jenis Multimeter</h3><div class="highlight-box"><h4>Analog</h4>Jarum, baik untuk fluktuasi</div><div class="highlight-box"><h4>Digital</h4>LCD, presisi tinggi</div>` },
            "bab3": { t: "BAB 3", icon: "flask-conical", h: "Praktik & Keselamatan", c: `<div class="info-box"><h4>Pengukuran Tegangan</h4><p>Paralel, pilih range tertinggi.</p></div><div class="warning-box"><h4>Pengukuran Arus</h4><p><strong>Seri</strong> — jangan paralel!</p></div><div class="warning-box"><h4>Ohmmeter</h4><p>Rangkaian harus mati.</p></div><h3>Aplikasi TKJ</h3><ul><li>Cek PSU</li><li>Kontinuitas kabel LAN</li></ul>` },
            "kalkulator": { t: "Kalkulator Ohm", icon: "calculator", h: "Kalkulator Hukum Ohm", c: `<div class="calculator-container"><h3 class="calculator-title"><i data-lucide="zap"></i> Hukum Ohm</h3><p>V = I × R</p><div class="formula-display"><strong>Rumus:</strong> V = I·R &nbsp;|&nbsp; I = V/R &nbsp;|&nbsp; R = V/I</div><div class="calculator-grid"><div class="input-group"><label>Tegangan (V)</label><input id="voltage" type="number" placeholder="Volt" step="0.1"></div><div class="input-group"><label>Arus (I)</label><input id="current" type="number" placeholder="Ampere" step="0.01"></div><div class="input-group"><label>Hambatan (R)</label><input id="resistance" type="number" placeholder="Ohm" step="0.1"></div></div><div class="calculator-buttons"><button class="calc-btn primary" id="calculate-btn"><i data-lucide="play"></i>Hitung</button><button class="calc-btn" id="reset-btn"><i data-lucide="rotate-ccw"></i>Reset</button><button class="calc-btn" id="example-btn"><i data-lucide="copy"></i>Contoh</button></div><div class="calculator-result" id="result" style="display:none;"><div class="result-title">Hasil:</div><div class="result-value" id="result-value">0</div><div class="result-unit" id="result-unit"></div><div id="calculation-detail"></div></div></div>` },
            "info": { t: "Referensi", icon: "table", h: "Tabel & Referensi", c: `<h3>Perbandingan Analog vs Digital</h3><table><tr><th>Aspek</th><th>Analog</th><th>Digital</th></tr><tr><td>Pembacaan</td><td>Jarum</td><td>LCD</td></tr><tr><td>Akurasi</td><td>±2-3%</td><td>±0.5%</td></tr></table><div class="info-box"><h4>Perawatan</h4><p>Simpan kering, kalibrasi tahunan.</p></div>` }
        };

        // Helper untuk render ikon lucide setelah konten dimuat
        function refreshIcons() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        const View = {
            renderNav: (active) => {
                const container = document.getElementById('nav-items');
                container.innerHTML = Object.keys(Model).map(k => `
                    <button class="nav-link ${k===active?'active':''}" onclick="Controller.navigateTo('${k}')" data-key="${k}">
                        <i data-lucide="${Model[k].icon || 'circle'}"></i> ${Model[k].t}
                    </button>
                `).join('');
                refreshIcons();
            },
            renderContent: (key) => {
                const page = Model[key] || Model.home;
                const app = document.getElementById('app');
                app.innerHTML = `<h2>${page.h}</h2><hr><div class="content">${page.c}</div>`;
                refreshIcons();
                if (key === 'kalkulator') Controller.initCalculator();
                Controller.resetProgressBar();
                setTimeout(() => Controller.setupProgressBar(), 100);
                document.getElementById('main-content').focus();
            },
            updateThemeIcon: (isDark) => {
                const icon = document.querySelector('#theme-toggle i');
                if (icon) icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                refreshIcons();
            },
            updateLayoutIcon: (isMobile) => {
                const icon = document.querySelector('#layout-toggle i');
                if (icon) icon.setAttribute('data-lucide', isMobile ? 'monitor' : 'smartphone');
                refreshIcons();
            },
            updateProgressBar: (percentage) => {
                const bar = document.getElementById('progress-bar');
                if (bar) bar.style.width = percentage + '%';
                const container = document.getElementById('progress-container');
                if (percentage > 0 && percentage < 100) container.classList.add('visible');
                else if (percentage >= 100) setTimeout(() => container.classList.remove('visible'), 800);
                else container.classList.remove('visible');
            }
        };

        const Controller = {
            init: () => {
                document.getElementById('theme-toggle').onclick = Controller.toggleTheme;
                document.getElementById('layout-toggle').onclick = Controller.toggleLayout;
                Controller.loadPreferences();
                window.addEventListener('hashchange', Controller.handleRoute);
                Controller.handleRoute();
                Controller.setupProgressBar();
                // refresh icons after initial load
                setTimeout(refreshIcons, 20);
            },
            setupProgressBar: () => {
                const main = document.querySelector('main');
                if (!main) return;
                const calc = () => {
                    const article = document.querySelector('article');
                    if (!article) return;
                    const articleHeight = article.offsetHeight;
                    const scrollTop = main.scrollTop;
                    const winH = main.clientHeight;
                    let progress = Math.min(100, Math.max(0, (scrollTop / (articleHeight - winH)) * 100));
                    View.updateProgressBar(progress);
                };
                main.addEventListener('scroll', calc);
                setTimeout(calc, 300);
            },
            resetProgressBar: () => View.updateProgressBar(0),
            handleRoute: () => {
                const key = location.hash.substring(1) || 'home';
                View.renderNav(key);
                View.renderContent(key);
                history.replaceState(null, null, `#${key}`);
            },
            navigateTo: (key) => { location.hash = key; },
            toggleTheme: () => {
                const body = document.body;
                const isDark = body.getAttribute('data-theme') === 'dark';
                body.setAttribute('data-theme', isDark ? '' : 'dark');
                localStorage.setItem('avo-theme', isDark ? 'light' : 'dark');
                View.updateThemeIcon(!isDark);
            },
            toggleLayout: () => {
                const body = document.body;
                const isMobile = body.classList.contains('mobile-mode');
                if (isMobile) body.classList.remove('mobile-mode');
                else body.classList.add('mobile-mode');
                localStorage.setItem('avo-layout', isMobile ? 'desktop' : 'mobile');
                View.updateLayoutIcon(!isMobile);
            },
            loadPreferences: () => {
                if (localStorage.getItem('avo-theme') === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    View.updateThemeIcon(true);
                }
                if (localStorage.getItem('avo-layout') === 'mobile') {
                    document.body.classList.add('mobile-mode');
                    View.updateLayoutIcon(true);
                }
            },
            initCalculator: () => {
                const v = document.getElementById('voltage'), i = document.getElementById('current'), r = document.getElementById('resistance');
                const resDiv = document.getElementById('result'), resVal = document.getElementById('result-value'), resUnit = document.getElementById('result-unit'), det = document.getElementById('calculation-detail');
                const isFilled = (inp) => inp.value !== '' && !isNaN(parseFloat(inp.value));
                const calc = () => {
                    const fv = isFilled(v), fi = isFilled(i), fr = isFilled(r);
                    if ([fv,fi,fr].filter(Boolean).length < 2) { alert('Isi minimal 2 nilai'); return; }
                    let val = 0, unit = '', detail = '';
                    if (fv && fi && !fr) { const V=+v.value, I=+i.value; val = V/I; unit='Ω'; detail=`R = ${V}V / ${I}A = ${val.toFixed(3)}Ω`; }
                    else if (fv && !fi && fr) { const V=+v.value, R=+r.value; val = V/R; unit='A'; detail=`I = ${V}V / ${R}Ω = ${val.toFixed(3)}A`; }
                    else if (!fv && fi && fr) { const I=+i.value, R=+r.value; val = I*R; unit='V'; detail=`V = ${I}A × ${R}Ω = ${val.toFixed(3)}V`; }
                    else { /* verifikasi */ }
                    resVal.textContent = val.toFixed(3); resUnit.textContent = unit; det.innerHTML = detail;
                    resDiv.style.display = 'block';
                };
                document.getElementById('calculate-btn').onclick = calc;
                document.getElementById('reset-btn').onclick = ()=> { v.value=i.value=r.value=''; resDiv.style.display='none'; };
                document.getElementById('example-btn').onclick = ()=> { v.value=12; i.value=0.5; r.value=''; calc(); };
                [v,i,r].forEach(inp => inp.addEventListener('keypress', e => e.key==='Enter'&&calc()));
                refreshIcons();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            Controller.init();
            // mobile fallback
            if (window.innerWidth <= 768 && !localStorage.getItem('avo-layout')) {
                document.body.classList.add('mobile-mode');
                View.updateLayoutIcon(true);
            }
        });
        window.addEventListener('resize', () => {
            const mobile = window.innerWidth <= 768;
            if (mobile && !localStorage.getItem('avo-layout')) document.body.classList.add('mobile-mode');
        });
    </script>
</body>
</html>
